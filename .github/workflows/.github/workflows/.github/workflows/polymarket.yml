name: EDGE Polymarket Updates

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Get EDGE files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect Polymarket data
        run: python polymarket.py

      - name: Save collected data
        uses: actions/upload-artifact@v4
        with:
          name: edge-polymarket-data
          path: edge_polymarket_sample.json
          retention-days: 1
