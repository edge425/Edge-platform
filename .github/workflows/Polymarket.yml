name: EDGE Polymarket Updates

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Get EDGE files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect Polymarket data
        run: python polymarket.py

      - name: Save collected data
        uses: actions/upload-artifact@v4
        with:
          name: edge-polymarket-data
          path: edge_polymarket_sample.json
          retention-days: 1
          
      
      - name: Publish live EDGE data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edge_polymarket_sample.json
          if ! git diff --cached --quiet; then
            git commit -m "Update live EDGE trader data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi


